<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js" defer></script>
    <style>
        h3 {
            &:has(.regexp-filter) {
                display: grid;
                grid-template-columns: max-content auto;

                >div {
                    display: block;
                    justify-self: center;
                }

                .regexp-filter {
                    border-radius: 1rem;
                    padding: 0 10px;
                    font-size: 1.1rem;
                    line-height: 1.5rem;
                    border-color: #CCCCCC;
                    border-style: solid;
                }
            }
        }

        .excels,
        .folders,
        .past {
            display: grid;
            gap: 1px;

            >* {
                outline: 1px solid #999;
                padding: 2px 8px;

                &:hover::before {
                    content: '';
                    background-color: #efefef;
                    position: absolute;
                    z-index: -1;
                    width: calc(100% - 16px);
                    height: calc(1.5rem + 4px);
                    left: 8px;
                    margin-top: -3px;
                }
            }

            a {
                text-decoration: none;
            }
        }

        .excels,
        .folders,
        .past {
            grid-template-columns: max-content auto max-content max-content;
        }

        .activate {
            text-align: center;
        }

        .past-separator {
            margin-top: 30px;
        }

        .del-activate {
            cursor: pointer;
            color: #999999;

            &:hover {
                color: white;
                background-color: red;
            }
        }

        .unfiltered-caption:has(+.unfiltered:not(:empty)) {
            margin-top: 10px;

            &::before {
                content: 'フィルタ対象外';
            }
        }
    </style>
    <title>Excel Switcher</title>
</head>

<body>
    <h3>Excel<div>
            <div><input type="search" class="regexp-filter" placeholder="フィルタ" autocomplete="on" name="filter"></div>
        </div>
    </h3>
    <div class="excels parent filtered"></div>
    <div class="unfiltered-caption"></div>
    <div class="excels parent unfiltered"></div>
    <h3>Folder</h3>
    <div class="folders parent"></div>
    <hr class="past-separator">
    <h3>[Recently Opened]</h3>
    <div class="past"></div>
</body>

</html>
