<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js" defer></script>
    <style>
        h3 {
            margin-bottom: 10px;
            color: #222222;

            &:has(.filter) {
                display: grid;
                grid-template-columns: max-content auto;

                >div {
                    display: block;
                    justify-self: center;
                }

                .filter {
                    border-radius: 1rem;
                    padding: 0 12px;
                    font-size: 1.1rem;
                    line-height: 1.5rem;
                    border-color: #CCCCCC;
                    border-style: solid;
                }

                input::-webkit-calendar-picker-indicator {
                    display: none !important;
                }

                input::-webkit-search-cancel-button {
                    margin-right: -4px;
                }
            }
        }

        .excels,
        .folders,
        .past {
            display: grid;
            gap: 1px;
            border-radius: 5px;
            border: 1px solid #222222;
            padding: 4px;

            >* {
                border-bottom: 1px solid #999999;
                padding: 2px 8px;

                &:hover::after {
                    content: '';
                    background-color: #D2E4FF;
                    position: absolute;
                    z-index: -1;
                    width: calc(100% - 16px);
                    height: calc(1.5rem + 4px);
                    left: 8px;
                    margin-top: -3px;
                }

                &:last-child,
                &:has(+:last-child),
                &:has(+*+:last-child),
                &:has(+*+*+:last-child) {
                    border: none;
                }
            }

            a {
                text-decoration: none;
            }
        }

        .excels,
        .folders,
        .past {
            grid-template-columns: max-content auto max-content max-content;
        }

        .activate {
            text-align: right;
        }

        .past-separator {
            margin-top: 30px;
        }

        .del-activate {
            cursor: pointer;
            color: #999999;

            &:hover {
                color: white;
                background-color: red;
            }
        }

        .unfiltered:empty {
            border: none;
        }

        .unfiltered-caption:has(+.unfiltered:not(:empty)) {
            margin-top: 10px;
            text-align: center;
            font-weight: 300;

            &::before {
                content: 'Filtered-out';
            }
        }
    </style>
    <title>Excel & Folders</title>
</head>

<body>
    <h3>Excel<div>
            <div>
                <form action="about:blank" target="hidden_target"><input type="search" class="filter"
                        placeholder="Filter" name="filter" autocomplete="on"></form>
            </div>
        </div>
    </h3>
    <div class="excels parent filtered"></div>
    <div class="unfiltered-caption"></div>
    <div class="excels parent unfiltered"></div>
    <h3>Folder</h3>
    <div class="folders parent"></div>
    <hr class="past-separator">
    <h3>[Recently Opened]</h3>
    <div class="past"></div>
    <iframe name="hidden_target" style="display:none;"></iframe>
</body>

</html>
