<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js" defer></script>
    <style>
        h3 {
            margin-bottom: 10px;
            color: #222222;

            &:has(.filter) {
                display: grid;
                grid-template-columns: max-content auto;

                >div {
                    display: block;
                    justify-self: center;
                }

                .filter {
                    border-radius: 1rem;
                    padding: 0 12px;
                    font-size: 1.1rem;
                    line-height: 1.5rem;
                    border-color: #CCCCCC;
                    border-style: solid;
                }

                input::-webkit-calendar-picker-indicator {
                    display: none !important;
                }

                input::-webkit-search-cancel-button {
                    margin-right: -4px;
                }
            }
        }

        .excels,
        .folders,
        .past {
            display: block;
            border-radius: 5px;
            border: 1px solid #222222;
            padding: 4px;
            border-collapse: collapse;

            tr {
                border-bottom: 1px solid #CCCCCC;

                &:last-child {
                    border: none;
                }

                &:hover {
                    outline: 2px solid #1DA1F2;
                    border-radius: 4px;
                }
            }

            td {
                padding: 2px 8px;

                &:first-child {
                    white-space: nowrap;
                }

                &.path {
                    width: 100%;
                    word-break: break-all;
                }
            }

            a {
                text-decoration: none;
            }

            .activate {
                text-align: right;
            }

            .past-separator {
                margin-top: 30px;
            }

            .del-activate {
                display: flex;
                text-align: center;
                padding: 2px 4px;
                cursor: pointer;
                color: #999999;

                &:hover {
                    color: white;
                    background-color: red;
                }
            }
        }

        .unfiltered:empty {
            border: none;
        }

        .unfiltered-caption:has(+.unfiltered:not(:empty)) {
            margin-top: 10px;
            font-weight: 300;

            &::before {
                content: 'Filtered-out';
            }
        }

        .excels.filtered,
        .excels.unfiltered:not(:empty) {
            background-color: #DAF2D0;
        }

        .folders {
            background-color: #FFFFCC;
        }
    </style>
    <title>Excel & Folders</title>
</head>

<body>
    <h3>Excel<div>
            <div>
                <form action="about:blank" target="hidden_target"><input type="search" class="filter"
                        placeholder="Filter" name="filter" autocomplete="on"></form>
            </div>
        </div>
    </h3>
    <table class="excels parent filtered"></table>
    <div class="unfiltered-caption"></div>
    <table class="excels parent unfiltered"></table>
    <h3>Folder</h3>
    <table class="folders parent"></table>
    <hr class="past-separator">
    <h3>[Recently Opened]</h3>
    <table class="past"></table>
    <iframe name="hidden_target" style="display:none;"></iframe>
</body>

</html>
